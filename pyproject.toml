[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labelkit"
version = "0.1.0"
description = "Unified MPN/Lcsc invoice to Brother P-touch label pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.scripts]
labelkit = "labelkit.cli:main"

[tool.setuptools.packages.find]
include = ["labelkit*"]

[tool.setuptools.package-data]
labelkit = ["templates/*.yaml", "formats.yaml"]
